name: Validate Second Nature
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Fetch pinned stable prototype definitions
        run: git clone --depth 1 --branch 2.0.77 https://github.com/wube/factorio-data.git .cache/factorio-data-2.0.77
      - run: python -m pytest -q
      - name: Verify generated locale is in sync
        run: |
          python tools/generate_locale.py
          git diff --exit-code -- second-nature/locale
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Second-Nature-installable-mods
          path: artifacts/
  engine:
    # Independent native checks give early API/schema feedback. Publishing still
    # waits for the entire reusable validation workflow, including source tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official stable headless build
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 https://factorio.com/get-download/2.0.77/headless/linux64 -o .cache/factorio.tar.xz
          tar -xJf .cache/factorio.tar.xz -C .cache
      - run: python tools/headless.py --factorio .cache/factorio/bin/x64/factorio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-engine-logs
          include-hidden-files: true
          path: .cache/engine-*/*.log
