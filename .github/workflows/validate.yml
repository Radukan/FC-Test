name: Validate Second Nature
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      engine:
        description: Also download the free official headless builds and run engine smoke tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lua-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Fetch pinned official prototype definitions
        run: |
          git clone --depth 1 --branch 2.0.77 https://github.com/wube/factorio-data.git .cache/factorio-data-2.0.77
          git clone --depth 1 --branch 2.1.17 https://github.com/wube/factorio-data.git .cache/factorio-data
      - run: python -m pytest -q
      - name: Verify generated locale is in sync
        run: |
          python tools/generate_locale.py
          git diff --exit-code -- second-nature/locale
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Second-Nature-installable-mods
          path: artifacts/
  engine:
    if: github.event_name == 'workflow_dispatch' && inputs.engine
    strategy:
      matrix:
        version: ['2.0.77', '2.1.17']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Download the official free headless build
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 "https://factorio.com/get-download/${{ matrix.version }}/headless/linux64" -o .cache/factorio.tar.xz
          tar -xJf .cache/factorio.tar.xz -C .cache
      - run: python tools/headless.py --factorio .cache/factorio/bin/x64/factorio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-logs-${{ matrix.version }}
          path: .cache/engine-*/*.log
