[technology-description]
sn-biofoundations=Start a living industry from stone, iron and water. The electric bioreactor replaces the need for an irreplaceable seed.
sn-composting=Turn biomass into the compost needed by logistics and planetary soil recovery.
sn-environmental-monitoring=Real restoration earns field samples. Read ecological fitness and automate responses with circuit telemetry.
sn-atmospheric-engineering=Scrub local pollution while rebuilding atmospheric suitability. Native organisms may resist even clean industry.
sn-water-cycle=Purified water connects climate, biology and industry. Keep byproducts flowing; they are part of the factory.
sn-reforestation=Seed a diverse biosphere, then exploit the efficiency of established cultivation. Forest growth is gentle on existing infrastructure.
sn-dirty-shortcuts=A deliberate compromise: rapid startup and higher material yields, paid for in pollution, sludge and planetary toxicity.
sn-thermal-engineering=Move beyond temperate Nauvis. High-power heat transfer works in either hot or frozen environments.
sn-closed-loops=Close the cartridge, water and thermal loops; bind the remaining waste into construction aggregate.
sn-clean-chemistry=Use energy and biology instead of fossil feedstocks. Better ore yields do not make contaminated effluent disappear.
sn-planetary-ecology=Every world has an ecological specialty. Restoration now becomes an interplanetary logistics problem.
sn-vulcanus-restoration=Weather volcanic basalt, shelter heat-loving pioneer life and export thermophile cultures. The lava stays lava.
sn-fulgora-remediation=Mine Fulgora's toxic legacy for useful metals. Rebuild soils on the islands without changing oil seas or lightning.
sn-gleba-symbiosis=Gleba is alive, not restored. Promote a diverse, stable ecology while retaining spores, spoilage and pentapod risk.
sn-habitat-engineering=Combine the specialties of three planets into biodiversity sanctuaries. No single-planet shortcut to mature ecosystems.
sn-climate-science=An interplanetary science built from actual climate work and three ecological specialties.
sn-aquilo-habitats=Build sheltered cryogenic gardens. Aquilo still needs heat, foundations and long-distance supplies.
sn-planetary-coordination=Operate planetary beacons on living worlds. Continuous shipments prove that restoration can outlive its construction phase.
sn-living-worlds=Win by sustaining every planet at self-sustaining status with a recent beacon cycle for ten uninterrupted minutes. No return flight required.
sn-ecological-research=Continue using the restored network after victory. Each level adds 2% laboratory productivity.
sn-expedition-defense=Replace expedition losses with wood-free arms, armor and sentries. Basic magazines and barricades can already be crafted by hand.
sn-induction-defense=Battery-fed rifles, electrical perimeter turrets and modular protection. Stronger defenses need a stronger energy economy.
sn-bastion-defense=Late-game magnetic lances and powered protection. Expensive ammunition, charging and friendly firing lanes remain real constraints.
sn-restoration-efficiency-1=Improve your productive clean installations, pollution capture and recently supported terrain recovery. Bonuses are bounded: total +15%, not instant greening or faster research clocks.
sn-restoration-efficiency-2=Improve your productive clean installations, pollution capture and recently supported terrain recovery. Bonuses are bounded: total +30%, not instant greening or faster research clocks.
sn-restoration-efficiency-3=Improve your productive clean installations, pollution capture and recently supported terrain recovery. Bonuses are bounded: total +45%, not instant greening or faster research clocks.
sn-living-logistics=Superconducting transport drives and high-capacity manipulators for a sustained interplanetary economy.
sn-field-robotics=Compact spring-driven construction assistants for local blueprint work. A carried controller winds and directs a large, slow crew without batteries, an equipment grid, roboports or logistic deliveries.
sn-field-robotics-2=Improve the field sequencer: 22-tile reach, 20% faster flight and shorter on-site work cycles. Native robots and other equipment are unchanged.
sn-field-robotics-3=Refine the field drive and job sequencer: 26-tile reach, 3-tile-per-second flight and one-second work cycles. No logistics network or power supply is introduced.
sn-practical-power=Small, contrasting power systems: clean daytime photovoltaic racks or fuel-fired startup generators.
sn-wind-power=Harvest variable atmospheric wind. A passive alternative with no fuel consumption or direct emissions.
sn-biomass-power=Turn cultivated biomass into prepared fuel and recover its mineral residue in a closed-loop generator.
sn-geothermal-power=Large closed-loop wells supply steady clean power, with planet-dependent geothermal yield.
sn-industrial-cogeneration=A high-output, high-emission chemical-fuel generator for heavy industry. Fuel and pollution remain real costs.
sn-solar-railway=Power a slow locomotive exclusively from installed roof panels and its onboard battery. Night operation is deliberately derated.
sn-solar-railway-2=Improve photovoltaic collection, battery capacity and traction while retaining solar-only power and lower night speeds.
sn-solar-railway-3=Dense solar arrays and a larger onboard store support faster clean rail, but not the speed of a conventional locomotive.

