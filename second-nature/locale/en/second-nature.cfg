[mod-setting-description]
sn-overhaul-progression=Default on. Add glass, compost and ecological materials to science, and integrate restoration technologies before rockets. Disable for an additive restoration campaign. Changing this requires a restart.
sn-restoration-speed=Scales ecological work and environmental drift. Base 0.3 rates are 30% of the old rapid coefficients; pollution capture is separately 25%. Process-optimization research adds at most 45% to clean work/capture and supported terrain recovery. Does not accelerate recipes, raid timers or the ten-minute victory hold.
sn-native-resistance=Off disables scripted restoration raids. Balanced respects grace, warning and cooldowns; Relentless is more aggressive. Pollution-fed Nauvis broods is a separate startup rule. Peaceful mode is respected; Gleba retains its native spore mechanics.
sn-grace-minutes=Time after the first completed restoration/dirty-impact cycle on EACH planet before scripted native waves can begin. Default 20.
sn-living-terrain=Render slow, time-integrated succession: sparse pioneer patches → grassland → lush ground, with gradual reversal under sustained smog. Habitat condition still simulates if visuals are off. Only mod-grown trees are removed by the new withering tracker; infrastructure, ore, paving, crop soils and Aquilo support remain protected.
sn-tree-growth=Plant trees only on eligible, unoccupied, restored ground with generous clearance from infrastructure and other trees. Requires Visible terrain recovery. Disabling stops future growth, not existing trees.
sn-network-victory=Use the five-world, ten-minute living network as the end condition. Disable to restore the prior stock Space Age finish setting. Disable and save BEFORE uninstalling the mod.
sn-show-welcome=Print a short guide and dashboard shortcut when first joining with Second Nature.
sn-desolate-start=New freeplay begins with an intact protected craft, shared cargo, four loaded sentries and riveted barricades. Initial Nauvis has no natural trees/fish. Existing saves are not sterilized or given replacement supplies.
sn-legacy-smog=Initial real pollution seeded once into each newly generated Nauvis chunk during a desolate campaign. Default 80; 0 disables legacy contamination. Existing saves are not seeded. Once the native future is resolved, newly discovered regions no longer introduce this ancient smog.
sn-biter-metabolism=Default on. Remove pollution-driven attack recruitment from Nauvis biter/spitter nests and disable pollution evolution (Gleban spores unchanged). Restoration raids target recently productive CLEAN machines. Pollution increasingly suppresses those raids; at 200 local units, warnings cancel and tracked waves retreat. Ordinary proximity combat, obstruction and retaliation still exist.
sn-menu-background=Replace vanilla menu simulations with the original Last Landing illustration. Turn off to retain vanilla or another mod’s menu simulations. Restart required.
sn-native-fate=Choose in game: a multiplayer administrator confirms the permanent choice in Air & natives after two clean minutes at Nauvis stage 5. Automatic symbiosis/eradication apply the selected policy at that milestone without a dialog. A completed choice cannot be reversed by changing this setting.
sn-expedition-character=Original feminine adult explorer with a fitted, fully covered industrial suit, armor variations and animated movement/tool/weapon poses. Turn off to keep the vanilla or another mod’s character appearance. This changes graphics, not character inventories/controllers.
sn-opening-audio=Play the landing transmission followed by We Need a Living World on first arrival at Nauvis. Disable to keep the normal arrival soundtrack.
sn-inserter-vectors=Allow pickup and delivery positions to be configured within two tiles on either axis. Existing endpoints remain unchanged until adjusted. Applies to every inserter prototype.
sn-field-drone-limit=Maximum concurrent wind-up construction drones for this player. Default 64, maximum 128. Drones and building materials must be carried in your inventory; no roboport or logistics network is used. The server-wide safety limit is 512 active field drones. Lowering the limit recalls surplus workers without losing reserved supplies.
sn-menu-music=Play After the Ash, an original atmospheric score for the main menu. Uses the game music-volume setting. Disable to restore the standard menu track.

