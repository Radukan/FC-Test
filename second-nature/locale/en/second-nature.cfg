[item-description]
sn-silica=Crushed stone for glass. A separate feedstock keeps automatic furnaces from choosing between glass and stone bricks.
sn-glass=Vessels, membranes and the first automation science packs.
sn-mineral-nutrients=Stable mineral feed for pioneer cultures. Not the perishable Gleban nutrient fuel.
sn-microbial-culture=A sealed, shelf-stable inoculum. Can be synthesized from minerals without wood, eggs or a starter seed.
sn-algal-biomass=Renewable organic feedstock. Its embodied energy comes from an electrically powered bioreactor.
sn-compost=The foundation of soil restoration and logistic science.
sn-biochar=Stable carbon from biomass. Useful as sorbent, soil amendment or fuel.
sn-activated-carbon=High-surface-area sorbent. Renewable activation is slow; coal activation is fast and dirty.
sn-filter-cartridge=Used by scrubbers and water filtration. Route spent cartridges back to reclamation.
sn-spent-filter=Not disposable: reclaim the carbon and glass, then treat the captured effluent.
sn-soil-substrate=Compost, mineral grains and biochar engineered into a stable rooting medium.
sn-seed-mix=A robust starter community for reclaimed ground.
sn-ceramic-membrane=A mineral water-cycle component, made without oil chemistry.
sn-thermal-buffer=A recyclable heat-transfer cartridge. Thermal fitness is climate suitability, not the game's temperature property.
sn-depleted-thermal-buffer=Recharge with clean water, biofilm and electricity. Never recycle for free fresh buffers.
sn-neutralization-charge=A mineral/carbon charge that binds toxic material into sludge.
sn-hazardous-sludge=Toxic debt made tangible. Vitrify it; stockpiling does not count as detoxification twice.
sn-vitrified-waste=Bound, inert industrial waste suitable for concrete.
sn-biofilm=A renewable membrane and pheromone carrier, recovered from composting.
sn-ecological-data=Physical field samples from completed restoration cycles. Research them or reclaim their contents.
sn-climate-data=Instrument samples from atmospheric, thermal and watershed operations.
sn-biosphere-data=Complex habitat samples for biodiversity matrices and advanced research.
sn-thermophile-culture=Vulcanus-exclusive organisms that stabilize mineral and thermal cycles.
sn-heavy-metal-cake=Recovered Fulgoran contamination. Refine it into useful metals and catalysts.
sn-holmium-catalyst=A Fulgoran catalyst for resilient, interplanetary ecosystems.
sn-symbiotic-culture=Gleban life rebalanced toward diversity rather than invasive monoculture.
sn-biodiversity-matrix=Thermophiles, holmium catalysts and Gleban symbionts woven into one ecological community.
sn-gaia-cell=An interplanetary maintenance consumable. Beacons need regular shipments, not just a one-time build.
sn-ecology-science-pack=Field-driven research into sustainable industrial systems.
sn-climate-science-pack=Cross-planet climate research using the specialties of Vulcanus, Fulgora and Gleba.
sn-restoration-science-pack=Produced only by operating planetary beacons on living worlds.
sn-algae-vat=Minerals, water and power become the first living feedstocks. No irreplaceable starter culture required.
sn-composter=Convert organics into compost, biofilm and low-temperature biochar.
sn-hydroponics-bay=Electrically powered cultivation. Efficient crops require a rooted ecosystem. Imports cannot bypass ecological surface conditions.
sn-electrolyzer=Hydrogen, oxygen, buffer recharging and clean chemistry. Powerful, but power-hungry.
sn-reclamation-plant=Recover filters, water and metals. Pipe every byproduct: blocked outputs stop real restoration.
sn-materials-kiln=Vitrify hazardous sludge and fire ceramics without a fossil burner.
sn-pyrolyzer=Cheap, fast activated carbon and forced substrates, at a measurable planetary toxicity cost.
sn-air-scrubber=Completed cycles improve atmospheric fitness and capture up to 40 local pollution or spores. Feed water and cartridges; reclaim spent filters.
sn-soil-enricher=Build living soil using real substrate, culture and water. Healthy ground appears around operating stations, never under infrastructure.
sn-seed-disperser=Grow biodiversity and, on safe terrain, forests. Atmosphere, heat, water and soil limit viable biomass.
sn-watershed=Rebuild the water cycle. Ocean geometry never changes; lava, oil seas and agricultural wetlands remain intact.
sn-thermal-exchanger=Actively normalize local climate using recyclable thermal buffers. Does not alter engine temperature, recipe pressure or Aquilo heating rules.
sn-detoxifier=Bind planetary toxins into sludge. Lower toxicity unlocks the upper biodiversity ceiling.
sn-pheromone-dampener=Consume biofilm to soften native resistance to restoration. No free protection from unpowered or idle machines.
sn-forcing-tower=Fast atmospheric gains at the expense of thermal balance, water and toxic debt. A bootstrap tool, not a path to a living world.
sn-basalt-conditioner=Vulcanus: calcite and water build soil and temper the climate. Operates only on Vulcanus; never modifies lava or demolisher territories.
sn-fulgoran-reclaimer=Fulgora: recover legacy heavy metals from scrap while removing toxic debt. Leave oil oceans, ruins and elevation alone.
sn-spore-tower=Gleba: filter spores and cultivate a balanced microbiome. Less pollution does not mean pentapods accept a changed habitat.
sn-cryogenic-garden=Aquilo: turn ice and ammonia into thermal and water-cycle recovery. These sheltered gardens still require heat and imported biology.
sn-sanctuary=Unite the specialties of three worlds into stable habitats. Requires a rooted ecosystem and draws strong native resistance.
sn-planetary-beacon=The living-world network. Complete a cycle at least every 90 seconds on every planet; sustain all five self-sustaining worlds for ten minutes.
sn-ecology-monitor=Outputs 0–100 fitness, toxicity, native pressure and stability; stage is 0–5. The first combinator section is reserved for automatic telemetry.

