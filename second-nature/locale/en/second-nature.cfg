[sn-planet]
nauvis=NAUVIS / Last Landing. No native trees or fish remain in a new campaign. Rebuild from mineral feedstocks and emergency cargo. Clear the legacy smog, defend the machines that bring life back, and decide whether the broods deserve a second nature.
vulcanus=VULCANUS / Weather the furnace. Heat and atmospheric instability make generic recovery slower. Basalt weathering supplies nutrients, while sheltered thermophiles become an export. Lava and demolishers remain.
fulgora=FULGORA / Life after the scrapyard. Toxic legacy waste, little water and thin soil define the challenge. Recover holmium catalysts from remediation; preserve the oil seas, lightning and islands.
gleba=GLEBA / Beyond the monoculture. A lush world is not necessarily a stable one. Rebalance invasive spores into symbiosis; preserve fertile crop tiles, spoilage and pentapod pressure.
aquilo=AQUILO / A garden beneath the ice. Climate recovery is slow without cryogenic gardens and reliable heat. Import living communities, recover water from ice and ammonia, and keep the thermal buffers circulating. No ice or foundation tiles are removed.

[sn-guide]
topic-1=Your first living factory
text-1=1. Recover the lander cargo, establish water/steam power and keep the four sentries loaded. The intact craft remains protected permanently. Orbit still requires a normal rocket.\n\n2. You do not need wood: the small-pole recipe uses iron sticks, cable and stone; the former wooden chest uses mineral-composite stocks. Stocks are hand-formed from iron and stone. Shotguns use those stocks too.\n\n3. Hand-crush stone into silica and smelt glass. Research Pioneer biology: mineral nutrients → cultures → algae, without natural seeds.\n\n4. Compost algae into substrate and biofilm. Soil stations still make ecological samples in dirty air, even when their living bonus is blocked. Algal biomass replaces wood in pioneer seed mix. Timber remains an optional renewable product.\n\n5. Supply scrubbers and clear local pollution to ≤ 10. Capture is deliberately slower than in 0.2; maintain multiple machines and close the filter/effluent loop.\n\n6. Research Frontier defense for replacement sentries, carbines, armor and field dressings. Basic expedition magazines and barricades are hand-craftable from the start.\n\n7. Upgrade through electrical defense and late bastion doctrine. Research ecological process optimization for bounded +15%, +30%, then +45% clean-work/capture and terrain-growth bonuses.
topic-2=Close the loops
text-2=FILTER LOOP\nBiochar → activated carbon → filter cartridges → scrubbers / filtration → spent cartridges → reclamation → carbon + glass + toxic effluent. Reclamation needs purified water; keep a little reserve to restart it.\n\nWASTE LOOP\nEffluent + neutralization charges → ordinary water + hazardous sludge → electric vitrification + glass → inert aggregate → concrete. Sludge is real inventory, not a magical negative-pollution button. Never let it back up at a detoxifier.\n\nTHERMAL LOOP\nFresh thermal buffers → climate exchangers / cryogenic gardens → depleted buffers → electrochemical recharge with biofilm and clean water → fresh buffers. Recycling buffers cannot manufacture fresh charge.\n\nSURPLUS SAMPLES\nEcological sample recovery returns nutrients and a little purified water; climate sample recovery returns glass and a little purified water; biosphere samples can be composted. These energy-consuming sinks keep mature operations running when research demand falls.\n\nPOWER\nA climate exchanger uses 4 MW, a beacon 5 MW, and all new assemblers require heat on Aquilo. Efficiency modules, solar, nuclear and later fusion are real infrastructure choices - not free green progress.
topic-3=Native resistance and dirty shortcuts
text-3=NAUVIS / POLLUTION-FED BROODS\nWith the default startup rule, pollution no longer recruits vanilla biter attack parties or drives pollution evolution. Ecological change instead mobilizes real nearby nests against recently productive clean restoration machines. Dirty retorts and forcing towers are never chosen as targets. Proximity combat, walls obstructing a path and retaliation remain possible.\n\nAt 200 pollution units in a target or nest chunk, new warnings are suppressed. Pollution during a warning cancels it. Tracked waves reaching a polluted target turn back; lesser concentrations reduce wave size and effective resistance. This is temporary protection: local soil/biodiversity gains need ≤ 10, and pollution creates ecological debt.\n\nWaves need an existing nest 96-512 tiles away. Warning: 45 seconds. Balanced grace: 20 minutes after first ecological work. Cooldown: eight minutes. At most 40 units and three tracked groups per world. Clean progress also sets a lower bound on the scripted wave’s strength. Clear the perimeter, build defenses or supply pheromone dampeners.\n\nGLEBA / Native spores still behave normally. Scripted ecological resistance is additional; pollution does not pacify pentapods. No invasions are invented on the other three planets. Peaceful mode and resistance Off disable the scripted waves.\n\nDIRTY SHORTCUTS / Pyrolysis and forcing buy throughput or local calm with waste, pollution and toxic debt. They cannot substitute for cleanup. Keep every byproduct moving and close the filter/effluent loop.
topic-4=Five planetary specialties
text-4=NAUVIS / Your ecological workshop. Develop clean chemistry and a reliable water/filter loop before leaving. Restored land gradually greens around active machines, with sparse tree growth outside infrastructure.\n\nVULCANUS / Basalt weathering uses calcite, tungsten ore and water to improve thermal and soil fitness. Condition the world to stage 1 to cultivate thermophiles. Export them.\n\nFULGORA / Remediate scrap with mineral electrolyte. Recover heavy-metal concentrate, then combine it with local holmium into biocatalysts at stage 1. Oil oceans, ruins and cliffs are protected. Export catalysts.\n\nGLEBA / Spore towers consume filters and nutrients to cultivate symbionts. At stage 3, sheltered yumako and jellynut cultivation becomes efficient, but still needs seeds and perishable nutrient logistics. Export symbionts.\n\nALL THREE / Assemble biodiversity matrices in a recovering (stage 3) ecosystem. These feed sanctuaries and support climate science. Planet identity conditions prevent off-world specialty production.\n\nAQUILO / Import biodiversity matrices to build cryogenic gardens. Buffer heat and turn ice/ammonia into water-cycle recovery. Existing heat mechanics never switch off. Gardens are sheltered sprite overlays: ice and foundation support remain unchanged.
topic-5=Automation, multiplayer and the endgame
text-5=Place an ecology circuit monitor and wire it to your factory. It outputs atmosphere, thermal balance, water, soil, biodiversity, toxicity, resistance and stability as integers 0-100. Stage is 0-5. Two additional signals report total planetary and local chunk pollution. Its first section is reserved for telemetry; filters there are overwritten.\n\nExamples: enable detoxifiers when toxicity > 5; enable seed supply when biodiversity < 96; enable thermal buffer production when thermal balance < 97; enable dampeners when resistance > 20. Use a decider latch if you want separate start/stop thresholds.\n\nStage 5 needs every fitness axis ≥ 90, toxicity ≤ 8, total pollution ≤ 500 and a completed hotspot survey with no chunk above 10. Aim for 95-100, not exactly 90; gentle environmental drift and local exposure mean a threshold-edge build will lose stability.\n\nUnlock Gaia coordination, feed a beacon on each living world, and research Second Nature with the resulting restoration science. Then hold all five stage-5 ecosystems for ten uninterrupted minutes with a recent completed beacon cycle on each world. Beacons need a cycle at least every 90 seconds. A broken link resets the timer.\n\nIn multiplayer, ecology is shared per planet. Research and beacon shipments belong to each force; one force cannot win using another’s beacons.\n\nOverhaul progression is a startup setting. Turn it off to preserve vanilla recipes while keeping restoration content. Before removing this mod from a save, disable Network victory, save again, and back up the save; this restores the stock Space Age end condition. Removing a content overhaul can still remove its machines and items.
topic-6=Expedition archive and precision logistics
text-6=PERSONAL LOG\nThe landing transmission plays before the expedition anthem on first arrival at Nauvis. The jukebox preserves the transmission, We Need a Living World and After the Ash for later playback. Select a jukebox or press Ctrl + Shift + J nearby. Local playback does not broadcast to the whole planet; multiplayer surface broadcasts require an administrator.\n\nINSERTER VECTORS\nOpen an inserter or select it and press Shift + I. Each grid covers offsets from -2 to +2 on both axes. Choose separate pickup and delivery tiles. The origin is blocked. Reset restores the current-direction default, bounded by the same range. Blueprint and robot placement preserve native custom vectors.\n\nLIVING-WORLD LOGISTICS\nThe vector servo inserter accelerates bulk transfer. The canopy stack inserter moves stacked cargo. Vital belts, tunnels and distribution manifolds share a 90-item-per-second base speed and retain normal belt stacking, filtering and priority controls. Underground connections span up to sixteen tiles.\n\nBIOLOGICAL DEFENSE\nRootweaver emplacements can use mycelial flechettes that slow exposed targets. Ordinary ballistic magazines remain compatible. Resonance diffusers disrupt movement with an electrical and pheromonal field. Pressure-lance rounds pierce armored targets and bind a small amount of actual airborne contamination at impact. They award no ecological fitness or science. Keep their firing lanes clear.\n\nTHE LIVING FRONTIER\nHabitat still grows and degrades over sustained time. The two-minute native decision hold, permanent Nauvis choice and five-world beacon victory remain unchanged.

