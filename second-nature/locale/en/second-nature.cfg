footer=Progress comes from production. Recovery comes from balance.   /   v0.1.0

[sn-planet]
nauvis=NAUVIS / Rebuild a fragmented home. Begin with soil and atmospheric recovery, then establish watersheds and pioneer forests. Biters interpret restoration as an attack on their habitat.
vulcanus=VULCANUS / Weather the furnace. Heat and atmospheric instability make generic recovery slower. Basalt weathering supplies nutrients, while sheltered thermophiles become an export. Lava and demolishers remain.
fulgora=FULGORA / Life after the scrapyard. Toxic legacy waste, little water and thin soil define the challenge. Recover holmium catalysts from remediation; preserve the oil seas, lightning and islands.
gleba=GLEBA / Beyond the monoculture. A lush world is not necessarily a stable one. Rebalance invasive spores into symbiosis; preserve fertile crop tiles, spoilage and pentapod pressure.
aquilo=AQUILO / A garden beneath the ice. Climate recovery is slow without cryogenic gardens and reliable heat. Import living communities, recover water from ice and ammonia, and keep the thermal buffers circulating. No ice or foundation tiles are removed.

[sn-guide]
topic-1=Your first living factory
text-1=1. Crush stone into silica in your inventory; smelt it into laboratory glass. In overhaul mode each red science pack also needs one glass.\n\n2. Research Pioneer biology. Build a pioneer bioreactor, connect electricity and water, and select mineral nutrients, then pioneer culture, then algae cultivation. A culture is returned by every algae cycle; no trees or starter seeds are mandatory.\n\n3. Research The living substrate. Compost algae into compost and biofilm. Logistic science consumes one compost. Make biochar and soil substrate in the composter.\n\n4. Research Field ecology. Supply a soil restoration station with substrate, culture and water. Its completed cycles improve the planet and produce ecological samples. Combine samples, glass and circuits into ecology science.\n\n5. Add atmospheric scrubbers, water filtration and watersheds. Empty EVERY output. Early spent filters and effluent can be buffered until Nothing left behind unlocks full reclamation.\n\n6. Add pioneer seed dispersers, heat exchangers and detoxifiers as needed. The dashboard shows current support ceilings and the next stage’s exact requirements. Do not solve a water shortage by building more seed dispensers.
topic-2=Close the loops
text-2=FILTER LOOP\nBiochar → activated carbon → filter cartridges → scrubbers / filtration → spent cartridges → reclamation → carbon + glass + toxic effluent. Reclamation needs purified water; keep a little reserve to restart it.\n\nWASTE LOOP\nEffluent + neutralization charges → ordinary water + hazardous sludge → electric vitrification + glass → inert aggregate → concrete. Sludge is real inventory, not a magical negative-pollution button. Never let it back up at a detoxifier.\n\nTHERMAL LOOP\nFresh thermal buffers → climate exchangers / cryogenic gardens → depleted buffers → electrochemical recharge with biofilm and clean water → fresh buffers. Recycling buffers cannot manufacture fresh charge.\n\nSURPLUS SAMPLES\nEcological sample recovery returns nutrients and a little purified water; climate sample recovery returns glass and a little purified water; biosphere samples can be composted. These energy-consuming sinks keep mature operations running when research demand falls.\n\nPOWER\nA climate exchanger uses 4 MW, a beacon 5 MW, and all new assemblers require heat on Aquilo. Efficiency modules, solar, nuclear and later fusion are real infrastructure choices—not free green progress.
topic-3=Native resistance and dirty shortcuts
text-3=Two pressures coexist. Ordinary pollution/spores still drive vanilla attacks where natives exist. Pollution is enabled on Vulcanus, Fulgora and Aquilo as well, but no new enemy populations are introduced. Ecological CHANGE also raises native resistance, especially new biodiversity. Fully maintained mature worlds quiet down as organisms adapt.\n\nSecond Nature waves happen only on Nauvis and Gleba. They need an existing enemy nest 96–512 tiles from a recently working restoration machine. You receive 45 seconds of warning. Clearing the perimeter is a valid solution. No nests means no scripted wave.\n\nBalanced waves contain at most 40 biters, with far fewer pentapods, a 20-minute local grace period and an eight-minute post-wave cooldown. Peaceful mode disables these waves. Settings can disable resistance independently of terraforming.\n\nPheromone dampeners consume biofilm, carbon and water to reduce resistance. Defend installations, maintain ammunition logistics, and expand in deliberate stages. An unpowered dampener does nothing.\n\nDirty pyrolysis produces carbon and soil cheaply. Atmospheric forcing rapidly improves atmosphere, but degrades thermal and water fitness and adds toxins. These are viable startup or emergency tools. They cannot meet the all-axis victory thresholds. Captured sludge must still be vitrified. Clean recipes trade fossil feedstocks for electricity, biological logistics and byproduct handling.
topic-4=Five planetary specialties
text-4=NAUVIS / Your ecological workshop. Develop clean chemistry and a reliable water/filter loop before leaving. Restored land gradually greens around active machines, with sparse tree growth outside infrastructure.\n\nVULCANUS / Basalt weathering uses calcite, tungsten ore and water to improve thermal and soil fitness. Condition the world to stage 1 to cultivate thermophiles. Export them.\n\nFULGORA / Remediate scrap with mineral electrolyte. Recover heavy-metal concentrate, then combine it with local holmium into biocatalysts at stage 1. Oil oceans, ruins and cliffs are protected. Export catalysts.\n\nGLEBA / Spore towers consume filters and nutrients to cultivate symbionts. At stage 3, sheltered yumako and jellynut cultivation becomes efficient, but still needs seeds and perishable nutrient logistics. Export symbionts.\n\nALL THREE / Assemble biodiversity matrices in a recovering (stage 3) ecosystem. These feed sanctuaries and support climate science. Planet identity conditions prevent off-world specialty production.\n\nAQUILO / Import biodiversity matrices to build cryogenic gardens. Buffer heat and turn ice/ammonia into water-cycle recovery. Existing heat mechanics never switch off. Gardens are sheltered sprite overlays: ice and foundation support remain unchanged.
topic-5=Automation, multiplayer and the endgame
text-5=Place an ecology circuit monitor and wire it to your factory. It outputs atmosphere, thermal balance, water, soil, biodiversity, toxicity, resistance and stability as integers 0–100. Stage is 0–5. Its first section is reserved for telemetry; filters there are overwritten.\n\nExamples: enable detoxifiers when toxicity > 5; enable seed supply when biodiversity < 96; enable thermal buffer production when thermal balance < 97; enable dampeners when resistance > 20. Use a decider latch if you want separate start/stop thresholds.\n\nStage 5 needs every fitness axis ≥ 90 and toxicity ≤ 8. Aim for 95–100, not exactly 90; gentle environmental drift and local exposure mean a threshold-edge build will lose stability.\n\nUnlock Gaia coordination, feed a beacon on each living world, and research Second Nature with the resulting restoration science. Then hold all five stage-5 ecosystems for ten uninterrupted minutes with a recent completed beacon cycle on each world. Beacons need a cycle at least every 90 seconds. A broken link resets the timer.\n\nIn multiplayer, ecology is shared per planet. Research and beacon shipments belong to each force; one force cannot win using another’s beacons.\n\nOverhaul progression is a startup setting. Turn it off to preserve vanilla recipes while keeping restoration content. Before removing this mod from a save, disable Network victory, save again, and back up the save; this restores the stock Space Age end condition. Removing a content overhaul can still remove its machines and items.

