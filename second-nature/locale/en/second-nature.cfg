[sn-lore]
title=Landing transmission: personal log
close=Close transmission log
transmission=They called this a dead world. They were wrong. Death is quiet. This place is still screaming. Every rusted pipe, every poisoned river, every empty sky. I helped build the machines that did this. I can't undo that. But I brought living cultures. Water filters. A little hope, sealed in steel. Humanity needs more than another factory. We need green horizons. We need a lush planet that can carry our children. So let the engines wake. Let the ground remember rain. I am staying. And I will make this world breathe again.

