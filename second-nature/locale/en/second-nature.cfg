[mod-setting-description]
sn-overhaul-progression=Default on. Add glass, compost and ecological materials to science, and integrate restoration technologies before rockets. Disable for an additive restoration campaign. Changing this requires a restart.
sn-restoration-speed=Multiplier for ecological gains, toxic debt and drift. Does not change physical production, recipe durations, pollution capture or the ten-minute victory hold. Default 1.
sn-native-resistance=Off disables scripted ecological-response waves. Balanced respects local grace, warnings and cooldowns. Relentless uses a lower threshold and shorter cooldown. Vanilla pollution attacks are unchanged; peaceful mode is always respected.
sn-grace-minutes=Time after the first completed restoration/dirty-impact cycle on EACH planet before scripted native waves can begin. Default 20.
sn-living-terrain=Safely recolor eligible natural ground and show Aquilo garden overlays. Never modifies water, lava, ice, oil oceans, farmland, cliffs, resources, player paving, ghosts or occupied tiles. Disabling stops future changes; it does not undo existing vegetation.
sn-tree-growth=Plant trees only on eligible, unoccupied, restored ground with generous clearance from infrastructure and other trees. Requires Visible terrain recovery. Disabling stops future growth, not existing trees.
sn-network-victory=Use the five-world, ten-minute living network as the end condition. Disable to restore the prior stock Space Age finish setting. Disable and save BEFORE uninstalling the mod.
sn-show-welcome=Print a short guide and dashboard shortcut when first joining with Second Nature.

